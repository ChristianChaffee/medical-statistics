<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Графики ВОЗ</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Данные Всемирной организации здравоохранения</h1>
    
    <div class="status" id="status">
        Выбран тип данных: <strong>Продолжительность жизни</strong>
    </div>
    
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <div class="panel-container">
        <div class="color-container">
            <input type="color" id="plotColor" class="color-input" value="#ff0000">
            <div class="color-preview" id="plotColorPreview"></div>
            Цвет графика
        </div>
        <div class="color-container">
            <input type="color" id="plotBackgroundColor" class="color-input" value="#ffffff">
            <div class="color-preview" id="plotBackgroundColorPreview"></div>
            Цвет фона под графиком
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const { ipcRenderer } = require('electron');

        let dataName, dataCountry;

        let dataSet = {
            label: "-",
            data: [0],
            years: [0],
            minIndex: 0,
            maxIndex: 0,
            color: '#ff0000',
            backgroundColor: '#ffffff'
        };

        ipcRenderer.on('parse-data', (event, data) => {
            dataSet.years = data.parsedData.years;
            dataSet.data = data.parsedData.values;
            dataSet.minIndex = data.minIndex;
            dataSet.maxIndex = data.maxIndex;

            updateChart();
        });

        ipcRenderer.on('main-data-update', (event, data) => {
            dataName = data.dataName;
            dataCountry = data.countryName;
            dataSet.label = dataName;
            updateChart();
        });
        
        let chart = null;
        
        function updateChart() {

            document.getElementById('status').innerHTML = 
                `Государство: <strong>${dataCountry}</strong><br>
                Тип данных: <strong>${dataName}</strong><br><br>
                Минимальное значение: <strong>${dataSet.data[dataSet.minIndex]} (${dataSet.years[dataSet.minIndex]} год)</strong><br>
                Максимальное значение: <strong>${dataSet.data[dataSet.maxIndex]} (${dataSet.years[dataSet.maxIndex]} год)</strong>`;

            if (chart) {
                // Обновляем существующий график
                chart.data.datasets[0].label = dataSet.label;
                chart.data.datasets[0].data = dataSet.data;
                chart.data.datasets[0].borderColor = dataSet.color;
                chart.data.datasets[0].backgroundColor = dataSet.backgroundColor;
                chart.data.labels = dataSet.years;
                chart.update();
            } else {
                // Создаем новый график
                createChart();
            }
        }
        
        function createChart() {
            const ctx = document.getElementById('myChart').getContext('2d');
            
            // Регистрируем шрифт перед созданием графика
            Chart.defaults.font.family = 'Arial, Helvetica, sans-serif';
            Chart.defaults.font.size = 12;
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dataSet.years,
                    datasets: [{
                        label: dataSet.label,
                        data: dataSet.data,
                        borderColor: dataSet.color,
                        //backgroundColor: dataSet.color + '20',
                        borderWidth: 2,
                        tension: 0.1,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Данные Всемирной организации здравоохранения',
                            font: {
                                family: 'Arial, Helvetica, sans-serif',
                                size: 16
                            }
                        },
                        legend: {
                            labels: {
                                font: {
                                    family: 'Arial, Helvetica, sans-serif'
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                font: {
                                    family: 'Arial, Helvetica, sans-serif'
                                }
                            }
                        },
                        y: {
                            ticks: {
                                font: {
                                    family: 'Arial, Helvetica, sans-serif'
                                }
                            },
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        const plotColor = document.getElementById('plotColor');
        const plotColorPreview = document.getElementById('plotColorPreview');

        const plotBackgroundColor = document.getElementById('plotBackgroundColor');
        const plotBackgroundColorPreview = document.getElementById('plotBackgroundColorPreview');

        plotColorPreview.style.backgroundColor = plotColor.value;
        plotBackgroundColorPreview.style.backgroundColor = plotBackgroundColor.value;

        // Обработчик изменения цвета
        plotColor.addEventListener('input', (event) => {
            const selectedColor = event.target.value;
            plotColorPreview.style.backgroundColor = selectedColor;
            dataSet.color = selectedColor;
            if(chart){
                updateChart();
            }
        });

        plotBackgroundColor.addEventListener('input', (event) => {
            const selectedColor = event.target.value;
            plotBackgroundColorPreview.style.backgroundColor = selectedColor;
            dataSet.backgroundColor = selectedColor;
            if(chart){
                updateChart();
            }
        });

    </script>
</body>
</html>
